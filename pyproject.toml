[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "vfc_datasets"
dynamic = ["version"]
description = "Toolkit for loading, parsing, and processing vulnerability-fixing commit datasets"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
    "gitpython>=3.1.40",
    "gdown>=5.0.0",
    "python-dotenv>=1.0.0",
    "httpx[http2]>=0.26.0",
    "psycopg2-binary>=2.9.9",
    "tree-sitter~=0.23.0",
    "tree-sitter-python~=0.23.0",
    "tree-sitter-java~=0.23.0",
    "tree-sitter-javascript~=0.23.0",
    "tree-sitter-c~=0.21.0",
    "tree-sitter-cpp~=0.23.0",
    "datasets>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "basedpyright>=1.39.0",
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pre-commit>=3.6.0",
]

[tool.setuptools.packages.find]
exclude = ["examples", "research", "tests"]

[tool.setuptools.package-data]
"vfc_datasets.transformations.enrichment.project_urls" = ["*.json"]
"vfc_datasets.function_level" = ["*.json"]

[tool.setuptools_scm]

[tool.basedpyright]
include = ["vfc_datasets"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
enableTypeIgnoreComments = true
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportImplicitStringConcatenation = false
reportUnusedCallResult = false
reportMissingTypeStubs = false
reportUnnecessaryIsInstance = false
reportUnnecessaryComparison = false
reportUnnecessaryContains = false
reportPropertyTypeMismatch = false
reportMatchNotExhaustive = false
reportUnsupportedDunderAll = false
reportAny = false
reportExplicitAny = false
reportUnannotatedClassAttribute = false

[tool.ruff]
line-length = 100
src = ["vfc_datasets", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "SIM108", "RUF012", "RUF022"]

[tool.ruff.lint.isort]
known-first-party = ["vfc_datasets"]

[tool.coverage.run]
source = ["vfc_datasets"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.",
    "pragma: no cover",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
#addopts = ["-x", "-m", "not integration and not slow"]
markers = [
    "asyncio: async tests",
    "integration: integration tests",
    "slow: slow tests that download datasets",
    "network: tests that require network access",
]
